# .github/workflows/02-environments-matrix.yml
# USFS AirFire CI/CD Style Guide: Level 2 - Matrix & Multi-Environment CD
#
# Educational Goals:
# 1. Learn how to run testing matrices to ensure multi-runtime compatibility.
# 2. Understand target-based Environments (`dev` vs. `prod`) in GitHub.
# 3. Leverage environment-scoped secrets (e.g., separate keys for Dev and Prod).
# 4. Configure event-based conditional execution (`if` statements).
# 5. Map CD triggers to AirFire Conventions:
#    - CD Dev on push to main/master.
#    - CD Prod on versioned tags (vM.m.r).

name: "02 - Environments & Matrix CD"

on:
  push:
    branches:
      - main
      - master
    tags:
      # Matches v1.0.0, v2.1.3, etc. (AirFire versioned tag convention: vM.m.r)
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci-test:
    name: Matrix Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Run tests in parallel across all defined matrix items
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      # Set to false so one failing version doesn't immediately cancel other jobs
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@f724c812feb0e3e4ad58ecdb0d97b0f62251a2b0 # v5.1.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          if [ -f pyproject.toml ]; then
            uv sync --all-groups --python ${{ matrix.python-version }}
          elif [ -f requirements.txt ]; then
            uv pip install --python ${{ matrix.python-version }} -r requirements.txt
            uv pip install --python ${{ matrix.python-version }} pytest
          else
            uv pip install --python ${{ matrix.python-version }} pytest
          fi

      - name: Run Tests
        run: uv run --python ${{ matrix.python-version }} pytest

  deploy-dev:
    name: Deploy to Dev
    needs: ci-test
    runs-on: ubuntu-latest
    # Execute ONLY on pushes to main/master (Dev CD trigger)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    # Binds job to the 'dev' GitHub Environment for logging and secret access
    environment:
      name: dev
      url: https://dev.airfire.org # Mock environment URL for illustration

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy Application to Dev Environment
        # In a real pipeline, replace this echo block with actual deployment steps
        # ${{ secrets.DEPLOY_TARGET_API_KEY }} is pulled from the 'dev' environment context
        run: |
          echo "Deploying to DEV environment..."
          echo "Target Host: ${{ vars.DEPLOY_HOST }}"
          echo "Using Dev API Key (Length: ${#SECRET})"
        env:
          SECRET: ${{ secrets.DEPLOY_TARGET_API_KEY }}

  deploy-prod:
    name: Deploy to Prod
    needs: ci-test
    runs-on: ubuntu-latest
    # Execute ONLY when pushing a tag matching vM.m.r (Prod CD trigger)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # Binds job to the 'prod' GitHub Environment
    # Note: In GitHub Settings, configure the 'prod' environment to require "Required Reviewers"
    # to enforce manual approval gates without locking the workflow code.
    environment:
      name: prod
      url: https://airfire.org # Mock environment URL for illustration

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy Application to Prod Environment
        # ${{ secrets.DEPLOY_TARGET_API_KEY }} is pulled from the 'prod' environment context
        run: |
          echo "Deploying to PROD environment..."
          echo "Target Host: ${{ vars.DEPLOY_HOST }}"
          echo "Release Tag: ${GITHUB_REF#refs/tags/}"
          echo "Using Prod API Key (Length: ${#SECRET})"
        env:
          SECRET: ${{ secrets.DEPLOY_TARGET_API_KEY }}
