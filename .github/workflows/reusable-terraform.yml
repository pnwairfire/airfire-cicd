name: "Reusable Terraform CI (Format, Validate, TFLint)"

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version to install"
        required: false
        type: string
        default: "1.9.0"
      working-directory:
        description: "Working directory for Terraform configs"
        required: false
        type: string
        default: "."
      run-fmt:
        description: "Run terraform fmt check"
        required: false
        type: boolean
        default: true
      run-validate:
        description: "Run terraform validate"
        required: false
        type: boolean
        default: true
      run-tflint:
        description: "Run tflint check"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  terraform-quality-gates:
    name: Terraform Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ inputs.terraform-version }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Set up TFLint
        if: ${{ inputs.run-tflint }}
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.51.0"

      - name: Terraform Format Check
        if: ${{ inputs.run-fmt }}
        shell: bash
        run: |
          terraform fmt -check -recursive .

      - name: Terraform Validate
        if: ${{ inputs.run-validate }}
        shell: bash
        run: |
          terraform init -backend=false
          terraform validate

      - name: TFLint Check
        if: ${{ inputs.run-tflint }}
        shell: bash
        run: |
          tflint --init
          tflint --recursive
