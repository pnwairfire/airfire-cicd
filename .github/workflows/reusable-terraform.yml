name: "Reusable Terraform CI (Format, Validate, TFLint)"

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "Terraform version to install"
        required: false
        type: string
        default: "1.14.0"
      working-directory:
        description: "Root working directory for Terraform discovery"
        required: false
        type: string
        default: "."
      run-fmt:
        description: "Run terraform fmt check"
        required: false
        type: boolean
        default: true
      run-validate:
        description: "Run multi-module terraform discovery and validation"
        required: false
        type: boolean
        default: true
      run-tflint:
        description: "Run tflint check"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  terraform-quality-gates:
    name: Terraform Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform ${{ inputs.terraform-version }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Set up TFLint
        if: ${{ inputs.run-tflint }}
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.51.0"

      - name: Terraform Format Check
        if: ${{ inputs.run-fmt }}
        shell: bash
        run: |
          terraform fmt -check -recursive .

      - name: TFLint Check
        if: ${{ inputs.run-tflint }}
        shell: bash
        run: |
          tflint --init
          tflint --recursive

      - name: Terraform Multi-Module Discovery & Validation
        if: ${{ inputs.run-validate }}
        shell: bash
        run: |
          echo "==> Discovering Terraform modules under $(pwd)..."
          TF_DIRS=$(find . -type f -name "*.tf" -not -path "*/.*/*" -exec dirname {} + | sort -u)
          if [ -z "$TF_DIRS" ]; then
            echo "No Terraform configurations found."
            exit 0
          fi

          echo "Discovered Terraform directories:"
          echo "$TF_DIRS"

          FAILED=0
          for dir in $TF_DIRS; do
            echo "--------------------------------------------------"
            echo "==> Validating module: $dir"
            echo "--------------------------------------------------"
            (
              cd "$dir"
              terraform init -backend=false -input=false || exit 1
              terraform validate || exit 1
            ) || {
              echo "❌ Validation failed for module: $dir"
              FAILED=1
            }
          done

          if [ $FAILED -ne 0 ]; then
            echo "❌ One or more Terraform modules failed validation."
            exit 1
          fi
          echo "✅ All discovered Terraform modules validated successfully."
